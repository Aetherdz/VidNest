name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VidNest Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate app version and protect existing releases
        id: app-version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('mobile-expo/app.json', 'utf8')).expo;
            const version = app.version;
            const versionCode = app.android?.versionCode;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`Expected a stable semantic app version, got: ${version}`);
            }
            if (!Number.isInteger(versionCode) || versionCode < 1) {
              throw new Error('Set a positive android.versionCode before publishing.');
            }
            const tag = `v${version}`;
            const checks = [
              ['release', () => github.rest.repos.getReleaseByTag({ ...context.repo, tag })],
              ['git tag', () => github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })],
            ];
            for (const [label, check] of checks) {
              try {
                await check();
                throw new Error(`Refusing to replace existing ${label} ${tag}.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        working-directory: mobile-expo
        run: npm install --legacy-peer-deps

      - name: Prebuild native Android project
        working-directory: mobile-expo
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: mobile-expo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon

      - name: Stage APK artifact
        run: |
          APK_FILE=$(find mobile-expo/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_FILE" VidNest.apk
          sha256sum VidNest.apk > VidNest.apk.sha256
          ls -lh VidNest.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidNest-apk
          path: VidNest.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.app-version.outputs.tag }}
          name: VidNest ${{ steps.app-version.outputs.tag }}
          body: |
            ### VidNest ${{ steps.app-version.outputs.tag }} — Official Android Release
            
            - **Platform:** Android (API 26+)
            - **Framework:** React Native + Expo SDK 54, StyleX, TypeScript
            - **Design System:** Sand & Terracotta Studio v4 + Readex Pro by **Atheerium** (`zaikabdou`)
            - **Backend:** Permanent Cloud API (`https://vidnest-web.onrender.com`)
            - **Features:** 1,800+ media platforms, 4K UHD video, lossless audio (MP3/M4A), zero ads, zero trackers.
            
            Download `VidNest.apk` directly to install.
          files: |
            VidNest.apk
            VidNest.apk.sha256
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
