<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>

    <linearGradient id="navyCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="securityCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="terracottaCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1C17"/>
      <stop offset="100%" stop-color="#17110E"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FB923C"/>
    </marker>

    <marker id="arrowSand" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FDBA74"/>
    </marker>
  </defs>

  <style>
    .font-title { font-family: "Readex Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .font-body { font-family: "Readex Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94A3B8; }
    .font-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1100" height="440" rx="16" fill="url(#bgGradArch)"/>
  <rect x="1" y="1" width="1098" height="438" rx="15" fill="none" stroke="#FB923C" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 36)">
    <rect width="168" height="24" rx="12" fill="#131B2E" stroke="#FB923C" stroke-opacity="0.45" stroke-width="1"/>
    <text x="14" y="16" fill="#FDBA74" class="font-code" font-weight="600">SYSTEM ARCHITECTURE</text>
    <text x="180" y="18" fill="#F8FAFC" class="font-title" font-size="20">VidNest Universal Architecture &amp; Security Pipeline</text>
  </g>

  <!-- Column 1: Client Surfaces -->
  <g transform="translate(40, 80)">
    <text x="10" y="20" fill="#F8FAFC" class="font-title" font-size="14" letter-spacing="0.5">1. CLIENT SURFACES</text>

    <!-- Box 1.1: Mobile Expo App -->
    <g transform="translate(0, 35)" filter="url(#cardShadow)">
      <rect width="300" height="92" rx="12" fill="url(#navyCardGrad)" stroke="#26334D" stroke-width="1.2"/>
      <rect x="14" y="14" width="8" height="8" rx="2" fill="#FB923C"/>
      <text x="30" y="22" fill="#F8FAFC" class="font-title" font-size="14">Mobile Expo App (SDK 54)</text>
      <text x="14" y="44" class="font-body">React Native + TypeScript cross-platform.</text>
      <text x="14" y="62" class="font-body">Sand &amp; Terracotta Studio · Astryx / StyleX.</text>
      <text x="14" y="80" class="font-code" fill="#FDBA74">Readex Pro · dir="rtl" · WCAG AA</text>
    </g>

    <!-- Box 1.2: Responsive Web Companion -->
    <g transform="translate(0, 140)" filter="url(#cardShadow)">
      <rect width="300" height="88" rx="12" fill="url(#navyCardGrad)" stroke="#26334D" stroke-width="1.2"/>
      <rect x="14" y="14" width="8" height="8" rx="2" fill="#C2410C"/>
      <text x="30" y="22" fill="#F8FAFC" class="font-title" font-size="14">Vercel + GitHub Pages Web</text>
      <text x="14" y="44" class="font-body">Semantic HTML5 + CSS3 + Vanilla ES2022.</text>
      <text x="14" y="62" class="font-body">Self-hosted Readex Pro WOFF2 · Zero CDNs.</text>
      <text x="14" y="80" class="font-code" fill="#94A3B8">PWA Ready · SEO / GEO / AEO Structured</text>
    </g>

    <!-- Box 1.3: Telegram Bot -->
    <g transform="translate(0, 240)" filter="url(#cardShadow)">
      <rect width="300" height="74" rx="12" fill="url(#navyCardGrad)" stroke="#26334D" stroke-width="1.2"/>
      <rect x="14" y="14" width="8" height="8" rx="2" fill="#0284C7"/>
      <text x="30" y="22" fill="#F8FAFC" class="font-title" font-size="14">Telegram Bot Companion</text>
      <text x="14" y="44" class="font-body">Bilingual Webhook / Polling client.</text>
      <text x="14" y="64" class="font-code" fill="#FDBA74">Inline Quality Selector · &lt;= 50MB Cap</text>
    </g>
  </g>

  <!-- Connectors 1 -> 2 -->
  <path d="M 340 160 L 390 160" stroke="#FB923C" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M 340 230 L 365 230 L 365 210 L 390 210" stroke="#FB923C" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
  <path d="M 340 280 L 375 280 L 375 240 L 390 240" stroke="#FB923C" stroke-width="1.5" stroke-dasharray="4" fill="none"/>

  <!-- Column 2: Gateway & Security -->
  <g transform="translate(400, 80)">
    <text x="10" y="20" fill="#F8FAFC" class="font-title" font-size="14" letter-spacing="0.5">2. RENDER API GATEWAY &amp; SHIELD</text>

    <!-- Box 2.1: Flask REST API -->
    <g transform="translate(0, 35)" filter="url(#cardShadow)">
      <rect width="320" height="92" rx="12" fill="url(#securityCardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="14" y="24" fill="#F8FAFC" class="font-title" font-size="14">Flask REST API &amp; Session Guard</text>
      <text x="14" y="46" class="font-body">Probe (`/api/formats`) · Download (`/api/download`)</text>
      <text x="14" y="64" class="font-body">One-click workflow (`/api/quick-download`)</text>
      <text x="14" y="82" class="font-code" fill="#FDBA74">CSRF Handshake · Strict CORS Allowlist</text>
    </g>

    <!-- Box 2.2: NetGuard SSRF Shield -->
    <g transform="translate(0, 140)" filter="url(#cardShadow)">
      <rect width="320" height="174" rx="12" fill="url(#securityCardGrad)" stroke="#FB923C" stroke-opacity="0.5" stroke-width="1.5"/>
      <rect x="14" y="14" width="8" height="8" rx="2" fill="#FB923C"/>
      <text x="30" y="22" fill="#FDBA74" class="font-title" font-size="14">NetGuard SSRF Shield (netguard.py)</text>
      <text x="14" y="44" class="font-body">Defense-in-depth outbound security layer:</text>

      <g transform="translate(14, 52)">
        <rect width="292" height="24" rx="4" fill="#0B0F19"/>
        <text x="8" y="16" fill="#F87171" class="font-code">🚫 BLOCKED: 127.0.0.1, ::1 (Loopback)</text>
      </g>
      <g transform="translate(14, 80)">
        <rect width="292" height="24" rx="4" fill="#0B0F19"/>
        <text x="8" y="16" fill="#F87171" class="font-code">🚫 BLOCKED: 10.0.0.0/8, 192.168.0.0/16</text>
      </g>
      <g transform="translate(14, 108)">
        <rect width="292" height="24" rx="4" fill="#0B0F19"/>
        <text x="8" y="16" fill="#F87171" class="font-code">🚫 BLOCKED: 169.254.169.254 (Cloud Meta)</text>
      </g>

      <text x="14" y="152" class="font-code" fill="#94A3B8">Strict HTTPS Only · IP Pinning on every hop</text>
    </g>
  </g>

  <!-- Connectors 2 -> 3 -->
  <path d="M 720 160 L 765 160" stroke="#FDBA74" stroke-width="2" fill="none" marker-end="url(#arrowSand)"/>
  <path d="M 720 230 L 765 230" stroke="#FDBA74" stroke-width="2" fill="none" marker-end="url(#arrowSand)"/>

  <!-- Column 3: Processing & Media Engine -->
  <g transform="translate(775, 80)">
    <text x="10" y="20" fill="#FDBA74" class="font-title" font-size="14" letter-spacing="0.5">3. MEDIA &amp; MUXING ENGINE</text>

    <!-- Box 3.1: yt-dlp Core -->
    <g transform="translate(0, 35)" filter="url(#cardShadow)">
      <rect width="285" height="82" rx="12" fill="url(#terracottaCardGrad)" stroke="#7C2D12" stroke-width="1.2"/>
      <text x="14" y="24" fill="#FDBA74" class="font-title" font-size="14">yt-dlp Core Extraction Engine</text>
      <text x="14" y="46" class="font-body">Universal support for 1,800+ sites.</text>
      <text x="14" y="66" class="font-code" fill="#FB923C">Format Discovery &amp; Metadata Inspection</text>
    </g>

    <!-- Box 3.2: FFmpeg Multiplexer -->
    <g transform="translate(0, 130)" filter="url(#cardShadow)">
      <rect width="285" height="92" rx="12" fill="url(#terracottaCardGrad)" stroke="#7C2D12" stroke-width="1.2"/>
      <text x="14" y="24" fill="#FDBA74" class="font-title" font-size="14">FFmpeg Stream Multiplexer</text>
      <text x="14" y="46" class="font-body">4K UHD Video + Best Audio Merging.</text>
      <text x="14" y="64" class="font-body">Lossless M4A copy &amp; Clean MP3 Encode.</text>
      <text x="14" y="82" class="font-code" fill="#FB923C">Output Format: Matroska / MP4</text>
    </g>

    <!-- Box 3.3: Storage Hygiene -->
    <g transform="translate(0, 235)" filter="url(#cardShadow)">
      <rect width="285" height="79" rx="12" fill="url(#terracottaCardGrad)" stroke="#7C2D12" stroke-width="1.2"/>
      <text x="14" y="24" fill="#FDBA74" class="font-title" font-size="14">Ephemeral Storage Hygiene</text>
      <text x="14" y="46" class="font-body">Randomized UUID per-job directory.</text>
      <text x="14" y="66" class="font-code" fill="#FB923C">Scheduled Garbage Sweeper (TTL purge)</text>
    </g>
  </g>
</svg>
