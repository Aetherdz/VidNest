<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FDBA74" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: "Readex Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    .font-sub { font-family: "Readex Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="260" fill="url(#glowAmber)" filter="url(#softGlow)"/>
  <circle cx="1020" cy="340" r="220" fill="url(#glowNavy)" filter="url(#softGlow)"/>
  <circle cx="1050" cy="80" r="180" fill="url(#glowAmber)" filter="url(#softGlow)"/>

  <!-- Subtle Precision Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="440" y1="0" x2="440" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
    <line x1="680" y1="0" x2="680" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="920" y1="0" x2="920" y2="420"/>
    <line x1="1040" y1="0" x2="1040" y2="420"/>
    <line x1="1160" y1="0" x2="1160" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#FB923C" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Left: VidNest Emblem -->
  <g transform="translate(90, 85)" filter="url(#dropShadow)">
    <rect width="130" height="130" rx="32" fill="url(#brandGrad)"/>
    <rect x="2" y="2" width="126" height="126" rx="30" fill="none" stroke="#FB923C" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M 38 44 L 65 94 L 92 44" fill="none" stroke="#FAF7F2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="57,36 80,50 57,64" fill="url(#amberGrad)"/>
    <circle cx="65" cy="110" r="4" fill="#FB923C"/>
  </g>

  <!-- Central Typography & Identity -->
  <g transform="translate(255, 115)">
    <g transform="translate(0, 0)">
      <rect width="280" height="30" rx="15" fill="#131B2E" stroke="#FB923C" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="14" cy="15" r="4" fill="#FB923C"/>
      <text x="26" y="20" fill="#FDBA74" font-size="12" class="font-mono" letter-spacing="0.5">SAND &amp; TERRACOTTA STUDIO v4</text>
    </g>

    <text x="0" y="80" fill="#F8FAFC" font-size="56" class="font-title" letter-spacing="-1">VidNest</text>

    <text x="0" y="116" fill="#94A3B8" font-size="20" class="font-sub">
      The quiet, privacy-first media downloader &amp; player ecosystem.
    </text>

    <!-- Capability Highlights / Spec Strip -->
    <g transform="translate(0, 145)">
      <g transform="translate(0, 0)">
        <rect width="168" height="34" rx="8" fill="#131B2E" stroke="#26334D" stroke-width="1"/>
        <text x="14" y="22" fill="#FDBA74" font-size="13" class="font-sub" font-weight="600">✦ 1,800+ Platforms</text>
      </g>
      <g transform="translate(178, 0)">
        <rect width="186" height="34" rx="8" fill="#131B2E" stroke="#26334D" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-size="13" class="font-sub">4K Video + MP3 / M4A</text>
      </g>
      <g transform="translate(374, 0)">
        <rect width="176" height="34" rx="8" fill="#131B2E" stroke="#26334D" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-size="13" class="font-sub">NetGuard SSRF Shield</text>
      </g>
      <g transform="translate(560, 0)">
        <rect width="160" height="34" rx="8" fill="#131B2E" stroke="#26334D" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-size="13" class="font-sub">Readex Pro · RTL AA</text>
      </g>
    </g>
  </g>

  <!-- Right Geometric Accents -->
  <g transform="translate(1010, 85)" opacity="0.88">
    <rect x="0" y="55" width="6" height="50" rx="3" fill="#C2410C"/>
    <rect x="14" y="35" width="6" height="90" rx="3" fill="#FB923C"/>
    <rect x="28" y="15" width="6" height="130" rx="3" fill="#FDBA74"/>
    <rect x="42" y="45" width="6" height="70" rx="3" fill="#FB923C"/>
    <rect x="56" y="65" width="6" height="30" rx="3" fill="#C2410C"/>
    <rect x="70" y="30" width="6" height="100" rx="3" fill="#FDBA74"/>
    <rect x="84" y="50" width="6" height="60" rx="3" fill="#FB923C"/>
  </g>

  <!-- Footer Baseline Info Strip -->
  <g transform="translate(90, 365)">
    <line x1="0" y1="0" x2="1020" y2="0" stroke="#26334D" stroke-width="1"/>

    <text x="0" y="25" fill="#94A3B8" font-size="13" class="font-sub">
      Ad-Free • Zero Trackers • Readex Pro (OFL) • 100% Open Source (MIT)
    </text>

    <g transform="translate(740, 7)">
      <rect width="280" height="26" rx="6" fill="#131B2E" stroke="#26334D" stroke-width="1"/>
      <text x="14" y="17" fill="#94A3B8" font-size="12" class="font-sub">
        Design &amp; Architecture: <tspan fill="#FB923C" font-weight="700">Atheerium</tspan> (<tspan fill="#F8FAFC">zaikabdou</tspan>)
      </text>
    </g>
  </g>
</svg>
