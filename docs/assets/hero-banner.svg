<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070D"/>
      <stop offset="50%" stop-color="#0E0C18"/>
      <stop offset="100%" stop-color="#141126"/>
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A4CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6A4CFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowForest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143326" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D8F3E5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B5EFF"/>
      <stop offset="100%" stop-color="#5538EE"/>
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8F3E5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143326"/>
      <stop offset="100%" stop-color="#0A1D15"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="260" fill="url(#glowViolet)" filter="url(#softGlow)"/>
  <circle cx="1020" cy="340" r="220" fill="url(#glowForest)" filter="url(#softGlow)"/>
  <circle cx="1050" cy="80" r="180" fill="url(#glowViolet)" filter="url(#softGlow)"/>

  <!-- Subtle Precision Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="440" y1="0" x2="440" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
    <line x1="680" y1="0" x2="680" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="920" y1="0" x2="920" y2="420"/>
    <line x1="1040" y1="0" x2="1040" y2="420"/>
    <line x1="1160" y1="0" x2="1160" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#6A4CFF" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Left: VidNest Emblem -->
  <g transform="translate(90, 85)" filter="url(#dropShadow)">
    <!-- Outer Violet Shield -->
    <rect width="130" height="130" rx="32" fill="url(#brandGrad)"/>
    <!-- Subtle Inner Border -->
    <rect x="2" y="2" width="126" height="126" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Nest Curve / Geometric 'V' Pattern -->
    <path d="M 38 42 L 65 92 L 92 42" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mint Center Accent Play Triangle -->
    <polygon points="61,54 75,64 61,74" fill="url(#mintGrad)"/>
    <!-- Pulse Ring Indicator -->
    <circle cx="65" cy="108" r="4" fill="#D8F3E5"/>
  </g>

  <!-- Central Typography & Identity -->
  <g transform="translate(255, 115)">
    <!-- Version & Instrument Pill -->
    <g transform="translate(0, 0)">
      <rect width="248" height="30" rx="15" fill="#18152A" stroke="#6A4CFF" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="15" r="4" fill="#D8F3E5"/>
      <text x="26" y="20" fill="#DCD7EE" font-size="12" class="font-mono" letter-spacing="0.5">VIOLET INSTRUMENT v4.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-size="56" class="font-title" letter-spacing="-1.5">VidNest</text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#A59EC2" font-size="20" class="font-sub">
      The quiet, privacy-first media downloader &amp; player ecosystem.
    </text>

    <!-- Capability Highlights / Spec Strip -->
    <g transform="translate(0, 145)">
      <!-- Pill 1: 1800+ Platforms -->
      <g transform="translate(0, 0)">
        <rect width="168" height="34" rx="8" fill="#161326" stroke="#2C2746" stroke-width="1"/>
        <text x="14" y="22" fill="#D8F3E5" font-size="13" class="font-sub" font-weight="600">✦ 1,800+ Platforms</text>
      </g>
      <!-- Pill 2: 4K & Audio Mux -->
      <g transform="translate(178, 0)">
        <rect width="186" height="34" rx="8" fill="#161326" stroke="#2C2746" stroke-width="1"/>
        <text x="14" y="22" fill="#E2DEFA" font-size="13" class="font-sub">4K Video + MP3 / M4A</text>
      </g>
      <!-- Pill 3: NetGuard SSRF Shield -->
      <g transform="translate(374, 0)">
        <rect width="176" height="34" rx="8" fill="#161326" stroke="#2C2746" stroke-width="1"/>
        <text x="14" y="22" fill="#E2DEFA" font-size="13" class="font-sub">NetGuard SSRF Shield</text>
      </g>
      <!-- Pill 4: Arabic RTL-First -->
      <g transform="translate(560, 0)">
        <rect width="160" height="34" rx="8" fill="#161326" stroke="#2C2746" stroke-width="1"/>
        <text x="14" y="22" fill="#E2DEFA" font-size="13" class="font-sub">RTL-Native &amp; WCAG AA</text>
      </g>
    </g>
  </g>

  <!-- Right Geometric Accents -->
  <g transform="translate(1010, 85)" opacity="0.85">
    <!-- Visual Soundwave / Frequency Bars -->
    <rect x="0" y="55" width="6" height="50" rx="3" fill="#6A4CFF"/>
    <rect x="14" y="35" width="6" height="90" rx="3" fill="#7B5EFF"/>
    <rect x="28" y="15" width="6" height="130" rx="3" fill="#D8F3E5"/>
    <rect x="42" y="45" width="6" height="70" rx="3" fill="#7B5EFF"/>
    <rect x="56" y="65" width="6" height="30" rx="3" fill="#6A4CFF"/>
    <rect x="70" y="30" width="6" height="100" rx="3" fill="#D8F3E5"/>
    <rect x="84" y="50" width="6" height="60" rx="3" fill="#7B5EFF"/>
  </g>

  <!-- Footer Baseline Info Strip -->
  <g transform="translate(90, 365)">
    <line x1="0" y1="0" x2="1020" y2="0" stroke="#6A4CFF" stroke-opacity="0.18" stroke-width="1"/>
    
    <text x="0" y="25" fill="#7D749B" font-size="13" class="font-sub">
      Ad-Free • Zero Trackers • Zero Emojis in UI • 100% Open Source (MIT)
    </text>

    <!-- Designer Attribution Badge -->
    <g transform="translate(740, 7)">
      <rect width="280" height="26" rx="6" fill="#120F20" stroke="#2B2446" stroke-width="1"/>
      <text x="14" y="17" fill="#A59EC2" font-size="12" class="font-sub">
        Design &amp; Architecture: <tspan fill="#D8F3E5" font-weight="700">Atheerium</tspan> (<tspan fill="#E2DEFA">zaikabdou</tspan>)
      </text>
    </g>
  </g>
</svg>
