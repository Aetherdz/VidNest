# VidNest on Fly.io — always-on machines, no free-tier sleep.
app = "vidnest"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  # The image lives with the web companion so the Dockerfile stays in its
  # own directory next to requirements.txt and static assets.
  dockerfile = "web/Dockerfile"

[env]
  PORT = "8000"
  VIDNEST_PUBLIC = "1"
  VIDNEST_TRUST_PROXY = "1"
  VIDNEST_MAX_FILE_MB = "1000"
  VIDNEST_STORAGE_MB = "4000"
  VIDNEST_THREADS = "16"
  VIDNEST_DOWNLOAD_DIR = "/tmp/vidnest-downloads"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[mounts]]
  source = "vidnest_downloads"
  destination = "/tmp/vidnest-downloads"
