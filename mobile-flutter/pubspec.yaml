name: vidnest
description: "VidNest — Mobile-first universal media downloader (Flutter, Material 3, Arabic RTL)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Local storage & Database
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Typography & Icons & Media
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
